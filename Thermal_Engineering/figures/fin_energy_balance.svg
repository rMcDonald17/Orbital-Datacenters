<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">Radiator fin domain, boundary conditions, and differential energy balance</title>
<desc id="dsc">Panel a shows the fin spanning from one embedded heat pipe to the next, with the solved domain running from the pipe contact at x equals zero to the symmetry plane at x equals L. The Dirichlet condition fixes temperature at the pipe contact; the Neumann condition sets zero gradient at the symmetry plane. Panel b cuts a slice of width dx from that domain and balances conduction along the facesheets against radiation leaving both outer surfaces and environmental flux absorbed on both, giving the nonlinear fin equation.</desc>

<rect x="0" y="0" width="720" height="650" fill="#FFFFFF"/>

<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g font-family="Helvetica, Arial, sans-serif">

<text x="36" y="46" font-size="12" fill="#2C2C2A">(a)  Domain and boundary conditions</text>

<path d="M160 74 C 230 86 330 100 370 104 C 410 100 510 86 580 74" fill="none" stroke="#D85A30" stroke-width="1.6"/>
<text x="248" y="76" font-size="11" fill="#993C1D">T(x)</text>
<circle cx="160" cy="74" r="3" fill="#D85A30"/>
<circle cx="370" cy="104" r="3" fill="#D85A30"/>

<g opacity="0.35">
<rect x="370" y="124" width="230" height="6" fill="#B4B2A9"/>
<rect x="370" y="130" width="230" height="18" fill="#F1EFE8"/>
<rect x="370" y="148" width="230" height="6" fill="#B4B2A9"/>
<rect x="370" y="124" width="230" height="30" fill="none" stroke="#888780" stroke-width="0.5"/>
<circle cx="580" cy="139" r="11" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>
</g>

<rect x="140" y="124" width="230" height="6" fill="#B4B2A9"/>
<rect x="140" y="130" width="230" height="18" fill="#F1EFE8"/>
<rect x="140" y="148" width="230" height="6" fill="#B4B2A9"/>
<rect x="140" y="124" width="230" height="30" fill="none" stroke="#888780" stroke-width="0.5"/>
<circle cx="160" cy="139" r="11" fill="#F0997B" stroke="#993C1D" stroke-width="0.8"/>

<line x1="370" y1="50" x2="370" y2="206" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>

<text x="612" y="132" font-size="10" fill="#5F5E5A">facesheet</text>
<text x="612" y="145" font-size="10" fill="#5F5E5A">core</text>
<text x="612" y="158" font-size="10" fill="#5F5E5A">heat pipe</text>

<line x1="160" y1="174" x2="370" y2="174" stroke="#888780" stroke-width="0.8" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="160" y1="168" x2="160" y2="180" stroke="#888780" stroke-width="0.8"/>
<line x1="370" y1="168" x2="370" y2="180" stroke="#888780" stroke-width="0.8"/>
<text x="265" y="192" text-anchor="middle" font-size="11" fill="#2C2C2A">solved domain,  0 ≤ x ≤ L</text>
<text x="478" y="192" text-anchor="middle" font-size="11" fill="#888780">mirror image, not solved</text>

<rect x="36" y="206" width="158" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="219" text-anchor="middle" font-size="11" fill="#085041">Dirichlet at pipe contact</text>
<text x="115" y="232" text-anchor="middle" font-size="12" fill="#04342C">T(0) = T<tspan font-size="9" dy="3">root</tspan></text>
<path d="M115 206 L 132 176 L 158 152" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="292" y="206" width="158" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="371" y="219" text-anchor="middle" font-size="11" fill="#3C3489">Neumann at symmetry plane</text>
<text x="371" y="232" text-anchor="middle" font-size="12" fill="#26215C">dT/dx = 0  at  x = L</text>

<text x="36" y="278" font-size="12" fill="#2C2C2A">(b)  Energy balance on a slice dx cut from (a)</text>

<rect x="140" y="350" width="460" height="6" fill="#B4B2A9"/>
<rect x="140" y="356" width="460" height="18" fill="#F1EFE8"/>
<rect x="140" y="374" width="460" height="6" fill="#B4B2A9"/>
<rect x="140" y="350" width="460" height="30" fill="none" stroke="#888780" stroke-width="0.5"/>

<rect x="330" y="350" width="90" height="30" fill="#E6F1FB"/>
<line x1="330" y1="330" x2="330" y2="460" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="420" y1="330" x2="420" y2="460" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

<line x1="262" y1="365" x2="324" y2="365" stroke="#185FA5" stroke-width="1.8" marker-end="url(#ab)"/>
<line x1="426" y1="365" x2="488" y2="365" stroke="#185FA5" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="250" y="348" text-anchor="end" font-size="11" fill="#185FA5">conduction in</text>
<text x="500" y="348" font-size="11" fill="#185FA5">conduction out</text>

<line x1="352" y1="346" x2="352" y2="302" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ac)"/>
<line x1="352" y1="384" x2="352" y2="428" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ac)"/>
<line x1="400" y1="302" x2="400" y2="346" stroke="#BA7517" stroke-width="1.8" marker-end="url(#aa)"/>
<line x1="400" y1="428" x2="400" y2="384" stroke="#BA7517" stroke-width="1.8" marker-end="url(#aa)"/>
<text x="340" y="294" text-anchor="end" font-size="11" fill="#D85A30">radiated</text>
<text x="412" y="294" font-size="11" fill="#BA7517">absorbed</text>

<line x1="330" y1="448" x2="420" y2="448" stroke="#888780" stroke-width="1" marker-start="url(#ag)" marker-end="url(#ag)"/>
<text x="375" y="466" text-anchor="middle" font-size="11" fill="#2C2C2A">dx</text>

<rect x="112" y="496" width="166" height="34" rx="4" fill="#E6F1FB"/>
<rect x="300" y="496" width="178" height="34" rx="4" fill="#FAECE7"/>
<rect x="500" y="496" width="122" height="34" rx="4" fill="#FAEEDA"/>
<text x="124" y="519" font-size="16" fill="#0C447C">2 k t<tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> </tspan>(d²T/dx²) dx</text>
<text x="289" y="519" font-size="16" fill="#2C2C2A">=</text>
<text x="310" y="519" font-size="16" fill="#712B13">2εσ(T⁴ − T<tspan font-size="11" dy="4">sp</tspan><tspan dy="-4">⁴</tspan>) dx</text>
<text x="486" y="519" font-size="16" fill="#2C2C2A">−</text>
<text x="510" y="519" font-size="16" fill="#633806">(q<tspan font-size="11" dy="4">A</tspan><tspan dy="-4"> </tspan>+ q<tspan font-size="11" dy="4">B</tspan><tspan dy="-4"></tspan>) dx</text>

<path d="M180 492 L 214 462 L 300 380" fill="none" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M370 492 L 356 434" fill="none" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="3 3"/>
<path d="M552 492 L 470 452 L 404 434" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="3 3"/>

<line x1="300" y1="548" x2="440" y2="548" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="452" y="552" font-size="11" fill="#5F5E5A">÷ 2 dx</text>

<text x="152" y="590" font-size="17" fill="#0C447C">k t<tspan font-size="11" dy="4">f</tspan><tspan dy="-4"> </tspan>d²T/dx²</text>
<text x="290" y="590" font-size="17" fill="#2C2C2A">=</text>
<text x="314" y="590" font-size="17" fill="#712B13">εσ(T⁴ − T<tspan font-size="11" dy="4">sp</tspan><tspan dy="-4">⁴</tspan>)</text>
<text x="462" y="590" font-size="17" fill="#2C2C2A">−</text>
<text x="486" y="590" font-size="17" fill="#633806">q<tspan font-size="11" dy="4">abs</tspan></text>
<text x="548" y="590" font-size="11" fill="#5F5E5A">q<tspan font-size="9" dy="3">abs</tspan><tspan dy="-3"> = (q</tspan><tspan font-size="9" dy="3">A</tspan><tspan dy="-3"> + q</tspan><tspan font-size="9" dy="3">B</tspan><tspan dy="-3">) / 2</tspan></text>

<text x="360" y="628" text-anchor="middle" font-size="10" fill="#888780">Symmetry between adjacent pipes makes the Neumann condition exact, not an approximation</text>

</g>
</svg>
