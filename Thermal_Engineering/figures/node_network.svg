<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ttl">Thermal node network</title>
<desc id="dsc">Energy enters at the solar array on the left as absorbed sunlight, is converted to electrical power at the cell efficiency, distributed through power management at its own efficiency to the payload, bus and battery, and then follows the thermal chain left to right: cold plate, pumped coolant loop, manifold and heat-pipe evaporator, radiator fin, and finally deep space on the right. The array and the bus reject their own waste heat by separate routed paths to the same boundary.</desc>

